services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        REGISTRY: ${REGISTRY:-}
    image: numetrix-backend:latest
    container_name: numetrix-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/db/app.db
      - UPLOAD_DIR=/data/uploads
      - CORS_ORIGINS=${PUBLIC_ORIGIN:-http://localhost:8088},http://localhost:3000
    volumes:
      - numetrix-data:/data
    expose:
      - "8000"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        REGISTRY: ${REGISTRY:-}
    image: numetrix-web:latest
    container_name: numetrix-web
    restart: unless-stopped
    environment:
      # The Next.js rewrite rule forwards /api/* here. In the same compose
      # network this is just the service hostname.
      - API_PROXY_TARGET=http://backend:8000
    expose:
      - "3000"
    depends_on:
      - backend

  proxy:
    image: ${REGISTRY:-}nginx:1.27-alpine
    container_name: numetrix-proxy
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - backend

volumes:
  numetrix-data:
    name: numetrix-data
