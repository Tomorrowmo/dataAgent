upstream numetrix_web   { server web:3000; }
upstream numetrix_api   { server backend:8000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 250M;
    proxy_read_timeout   600;
    proxy_send_timeout   600;

    # API → backend
    location /api/ {
        proxy_pass         http://numetrix_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE for chat streaming
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Everything else → Next.js
    location / {
        proxy_pass         http://numetrix_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Next 15 + React 19 strip stylesheet <link> tags from SSR output of
        # root layouts in our build (it's hoisted via streaming JS only).
        # The Tailwind precompile lives at /styles.css; inject it here so the
        # initial render is styled. See package.json "css:build".
        proxy_set_header   Accept-Encoding   "";
        sub_filter         '<meta charSet="utf-8"/>' '<meta charSet="utf-8"/><link rel="stylesheet" href="/styles.css"/>';
        sub_filter_once    on;
        sub_filter_types   text/html;
    }
}
